name: DebugMesh Entrega 1 - testes e evidencias

on:
  push:
    branches: [release/primeira-entrega]
  pull_request:
    branches: [release/primeira-entrega]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test unit, gRPC, causal order, concurrency and election
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/python-tests
          python -m pytest -q --junitxml=artifacts/python-tests/pytest.xml 2>&1 | tee artifacts/python-tests/pytest.txt
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-${{ matrix.python-version }}
          path: artifacts/python-tests/
          if-no-files-found: warn
          retention-days: 30

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI and protobuf client
        run: python -m pip install -e .
      - name: Start distributed Docker cluster
        run: docker compose up --build -d
      - name: Assert real RPC, worker distribution, Lamport, worker failure and leader failover
        run: python scripts/verify_compose_entrega1.py
      - name: Save Docker logs even if verification fails
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/entrega1-compose
          docker compose logs --no-color --timestamps > artifacts/entrega1-compose/docker-compose.log 2>&1 || true
          docker compose ps --all > artifacts/entrega1-compose/compose-ps.txt 2>&1 || true
      - name: Upload reproducible Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entrega1-docker-evidencias
          path: artifacts/entrega1-compose/
          if-no-files-found: warn
          retention-days: 30
      - name: Shutdown
        if: always()
        run: docker compose down -v

  sbc-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX and PDF inspector
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese poppler-utils
      - name: Build SBC PDF and enforce maximum 4 pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/relatorio
          TEXINPUTS="docs/sbc//:" pdflatex -interaction=nonstopmode -halt-on-error -output-directory=artifacts/relatorio docs/relatorio-entrega1.tex 2>&1 | tee artifacts/relatorio/build.log
          TEXINPUTS="docs/sbc//:" pdflatex -interaction=nonstopmode -halt-on-error -output-directory=artifacts/relatorio docs/relatorio-entrega1.tex >> artifacts/relatorio/build.log 2>&1
          pdfinfo artifacts/relatorio/relatorio-entrega1.pdf > artifacts/relatorio/pdfinfo.txt
          pages="$(awk '/^Pages:/ { print $2 }' artifacts/relatorio/pdfinfo.txt)"
          test -n "$pages" && test "$pages" -ge 1 && test "$pages" -le 4
          printf 'Relatorio SBC compilado: %s paginas (limite: 4)\n' "$pages" | tee artifacts/relatorio/paginas.txt
          printf '## Relatorio SBC\nPDF compilado: **%s paginas** (maximo: 4).\n' "$pages" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report and compilation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entrega1-relatorio-sbc
          path: artifacts/relatorio/
          if-no-files-found: warn
          retention-days: 30
